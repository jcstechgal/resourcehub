  <!-- Google Fonts: Inter -->

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

<body class="bg-slate-100 text-slate-800 min-h-screen pb-16">

  <!-- Header Banner (Johnson City Schools Maroon & Gold Theme) -->
  <header class="bg-gradient-to-r from-red-950 via-red-900 to-neutral-900 text-white py-10 px-4 shadow-xl border-b-4 border-amber-500">
    <div class="max-w-7xl mx-auto text-center">
      <span class="bg-amber-500/20 text-amber-300 border border-amber-400/30 text-xs font-bold px-3.5 py-1 rounded-full uppercase tracking-wider">
        Johnson City Schools • District Staff Portal
      </span>
      <h1 class="text-3xl md:text-5xl font-extrabold mt-3 tracking-tight text-white">EdTech Resource Directory</h1>
      <p class="mt-3 text-red-100 max-w-2xl mx-auto text-sm md:text-base font-normal">
        Explore district-approved software, watch quick tutorial overviews, and search tools matched to your teaching objectives.
      </p>
    </div>
  </header>

  <!-- Control & Filter Panel -->
  <main class="max-w-7xl mx-auto px-4 md:px-6 -mt-6">
    <div class="bg-white rounded-2xl shadow-md border border-slate-200/80 p-5 md:p-6 mb-8">
      
      <!-- Top Search & Dropdown Controls -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
        <!-- Text Search -->
        <div class="relative">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Search Tools & Objectives</label>
          <div class="relative">
            <input type="text" id="searchInput" placeholder="Search 'fractions', 'reading', 'Kahoot'..." 
                   class="w-full border border-slate-300 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-800 focus:border-transparent transition">
            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
        </div>

        <!-- Objective Filter -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Teaching Objective</label>
          <select id="objectiveFilter" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-800 focus:border-transparent transition">
            <option value="">All Objectives</option>
          </select>
        </div>

        <!-- Category Dropdown -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Filter by Category</label>
          <select id="categoryFilter" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-800 focus:border-transparent transition">
            <option value="">All Categories</option>
          </select>
        </div>
      </div>

      <!-- Category Pill Quick-Nav Bar -->
      <div class="pt-4 border-t border-slate-100 flex flex-wrap gap-2 items-center" id="pillContainer">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2">Quick Jump:</span>
        <!-- JS dynamically generates category pills here -->
      </div>

    </div>

    <!-- Active Results Counter -->
    <div class="flex items-center justify-between mb-6 px-1">
      <div class="text-sm text-slate-600 font-semibold" id="resultsCount">Loading tools...</div>
      <button id="resetFiltersBtn" onclick="resetFilters()" class="text-xs font-semibold text-red-800 hover:text-red-950 hidden">
        ✕ Clear Filters
      </button>
    </div>

    <!-- Grouped Container -->
    <div id="groupedContent" class="space-y-12"></div>
  </main>

  <!-- Video Modal -->

        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 font-bold text-2xl leading-none transition">&times;</button>
      </div>
      <div class="aspect-video w-full bg-black">

    // Populate Filters and Pills
    function populateFilters() {
      const categories = [...new Set(platforms.map(p => p.category))].sort();
      const objectives = [...new Set(platforms.flatMap(p => p.objectives))].sort();

      const catSelect = document.getElementById('categoryFilter');
      const objSelect = document.getElementById('objectiveFilter');
      const pillContainer = document.getElementById('pillContainer');

      categories.forEach(cat => {
        catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
        const conf = categoryConfig[cat] || { icon: "📁" };
        pillContainer.innerHTML += `
          <button onclick="filterByCategoryPill('${cat}')" 
                  class="text-xs bg-slate-100 hover:bg-red-50 hover:text-red-900 text-slate-600 font-semibold px-3 py-1.5 rounded-lg border border-slate-200/80 transition flex items-center gap-1.5">
            <span>${conf.icon}</span> ${cat}
          </button>
        `;
      });

      objectives.forEach(obj => {
        objSelect.innerHTML += `<option value="${obj}">${obj}</option>`;
      });
    }

    function filterByCategoryPill(catName) {
      document.getElementById('categoryFilter').value = catName;
      filterData();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('categoryFilter').value = '';
      document.getElementById('objectiveFilter').value = '';
      filterData();
    }

    // Render Grouped Sections
    function renderGroupedCards(data) {
      const container = document.getElementById('groupedContent');
      const count = document.getElementById('resultsCount');
      const resetBtn = document.getElementById('resetFiltersBtn');
      container.innerHTML = '';

      const isFiltered = document.getElementById('searchInput').value || 
                         document.getElementById('categoryFilter').value || 
                         document.getElementById('objectiveFilter').value;

      resetBtn.classList.toggle('hidden', !isFiltered);
      count.textContent = `Showing ${data.length} resource${data.length === 1 ? '' : 's'}`;

      if (data.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-white rounded-2xl border border-slate-200">
            <span class="text-4xl">🔍</span>
            <h3 class="text-lg font-bold text-slate-700 mt-3">No matching tools found</h3>
            <p class="text-slate-500 text-sm mt-1">Try adjusting your keyword search or objective filters.</p>
            <button onclick="resetFilters()" class="mt-4 bg-red-900 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-red-950 transition">
              Clear All Filters
            </button>
          </div>
        `;
        return;
      }

      // Group platforms by category
      const grouped = data.reduce((acc, p) => {
        acc[p.category] = acc[p.category] || [];
        acc[p.category].push(p);
        return acc;
      }, {});

      // Iterate through each category group
      Object.keys(grouped).sort().forEach(cat => {
        const items = grouped[cat];
        const conf = categoryConfig[cat] || { icon: "📁", color: "from-slate-600 to-slate-800", badgeBg: "bg-slate-100 text-slate-700" };

        let cardsHtml = items.map(p => {
          const tagsHtml = p.objectives.map(obj => 
            `<span class="text-[11px] bg-slate-100 text-slate-600 font-medium px-2 py-0.5 rounded">${obj}</span>`
          ).join('');

          const isVideoEmbed = p.videoUrl.includes('youtube') || p.videoUrl.includes('vimeo') || p.videoUrl.includes('embed');
          const btnLabel = isVideoEmbed ? '<span>▶</span> Overview' : '<span>📖</span> Tutorial';

          return `
            <div class="bg-white rounded-xl border border-slate-200/90 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition duration-200 p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-start justify-between gap-2 mb-2">
                  <h3 class="text-base font-bold text-slate-800 leading-snug">${p.name}</h3>
                </div>
                <p class="text-slate-600 text-xs mb-4 leading-relaxed">${p.description}</p>
                <div class="flex flex-wrap gap-1 mb-5">
                  ${tagsHtml}
                </div>
              </div>
              <div class="flex items-center gap-2 pt-3 border-t border-slate-100 mt-auto">
                <button onclick="openModal('${p.name}', '${p.videoUrl}')" 
                        class="flex-1 bg-red-50 hover:bg-red-100 text-red-900 font-semibold text-xs py-2 px-2.5 rounded-lg transition text-center flex items-center justify-center gap-1">
                  ${btnLabel}
                </button>
                <a href="${p.url}" target="_blank" 
                   class="bg-slate-800 hover:bg-slate-900 text-white font-semibold text-xs py-2 px-3 rounded-lg transition whitespace-nowrap">
                  Open Site ↗
                </a>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML += `
          <section id="${cat.replace(/\s+/g, '-').toLowerCase()}" class="scroll-mt-6">
            <!-- Category Header -->
            <div class="flex items-center gap-3 mb-4 border-b border-slate-200/80 pb-3">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-br ${conf.color} text-white flex items-center justify-center text-lg shadow-sm font-bold">
                ${conf.icon}
              </div>
              <div>
                <h2 class="text-xl font-bold text-slate-800">${cat}</h2>
                <span class="text-xs font-medium text-slate-400">${items.length} platform${items.length === 1 ? '' : 's'} available</span>
              </div>
            </div>
            <!-- Category Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              ${cardsHtml}
            </div>
          </section>
        `;
      });
    }

    // Filter Logic
    function filterData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const selectedCat = document.getElementById('categoryFilter').value;
      const selectedObj = document.getElementById('objectiveFilter').value;

      const filtered = platforms.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(search) || 
                              p.description.toLowerCase().includes(search) ||
                              p.objectives.some(o => o.toLowerCase().includes(search));
        const matchesCat = !selectedCat || p.category === selectedCat;
        const matchesObj = !selectedObj || p.objectives.includes(selectedObj);

        return matchesSearch && matchesCat && matchesObj;
      });

      renderGroupedCards(filtered);
    }

    // Modal Controls
    function openModal(title, videoUrl) {
      if (!videoUrl) return;
      if (videoUrl.includes('youtube') || videoUrl.includes('vimeo') || videoUrl.includes('embed')) {
        document.getElementById('modalTitle').textContent = title + " - Overview";
        document.getElementById('modalIframe').src = videoUrl;
        document.getElementById('videoModal').classList.remove('hidden');
      } else {
        window.open(videoUrl, '_blank');
      }
    }

    function closeModal() {
      document.getElementById('videoModal').classList.add('hidden');
      document.getElementById('modalIframe').src = '';
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);
    document.getElementById('objectiveFilter').addEventListener('change', filterData);

    // Initial Setup
    populateFilters();
    renderGroupedCards(platforms);
  </script>
</body>
</html>
