<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-700 text-white py-8 px-4 shadow-md">
    <div class="max-w-6xl mx-auto text-center">
      <h1 class="text-3xl md:text-4xl font-bold">EdTech Resource Directory</h1>
      <p class="mt-2 text-indigo-100">Search by platform name, category, or teaching objective.</p>
    </div>
  </header>

  <!-- Search & Filter Controls -->
  <main class="max-w-6xl mx-auto p-4 md:p-6">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 md:p-6 mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Text Search Bar -->
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Search Keywords</label>
        <input type="text" id="searchInput" placeholder="e.g., Kahoot, Math, Video, Reading..." 
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- Category Dropdown -->
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Filter Category</label>
        <select id="categoryFilter" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">All Categories</option>
        </select>
      </div>

      <!-- Objective Dropdown -->
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Teaching Objective</label>
        <select id="objectiveFilter" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">All Objectives</option>
        </select>
      </div>

    </div>

    <!-- Active Results Counter -->
    <div class="mb-4 text-sm text-slate-500 font-medium" id="resultsCount"></div>

    <!-- Cards Grid -->
    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

      <div class="aspect-video w-full bg-black">

    // Populate Dynamic Dropdown Options
    function populateFilters() {
      const categories = [...new Set(platforms.map(p => p.category))].sort();
      const objectives = [...new Set(platforms.flatMap(p => p.objectives))].sort();

      const catSelect = document.getElementById('categoryFilter');
      categories.forEach(cat => {
        catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });

      const objSelect = document.getElementById('objectiveFilter');
      objectives.forEach(obj => {
        objSelect.innerHTML += `<option value="${obj}">${obj}</option>`;
      });
    }

    // Render Cards
    function renderCards(data) {
      const grid = document.getElementById('cardsGrid');
      const count = document.getElementById('resultsCount');
      grid.innerHTML = '';
      count.textContent = `Showing ${data.length} resource${data.length === 1 ? '' : 's'}`;

      if (data.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No platforms match your criteria. Try adjusting your search.</div>`;
        return;
      }

      data.forEach(p => {
        const tagsHtml = p.objectives.map(obj => 
          `<span class="text-xs bg-indigo-50 text-indigo-700 font-medium px-2 py-1 rounded-md">${obj}</span>`
        ).join('');

        grid.innerHTML += `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition p-5 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <h2 class="text-lg font-bold text-slate-800">${p.name}</h2>
                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-semibold whitespace-nowrap">${p.category}</span>
              </div>
              <p class="text-slate-600 text-sm mb-4 leading-relaxed">${p.description}</p>
              <div class="flex flex-wrap gap-1.5 mb-6">
                ${tagsHtml}
              </div>
            </div>
            <div class="flex items-center gap-2 pt-3 border-t border-slate-100">
              <button onclick="openModal('${p.name}', '${p.videoUrl}')" 
                      class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold text-sm py-2 px-3 rounded-lg transition text-center">
                ▶ Video Overview
              </button>
              <a href="${p.url}" target="_blank" 
                 class="bg-slate-800 hover:bg-slate-900 text-white font-semibold text-sm py-2 px-3 rounded-lg transition">
                Open Site ↗
              </a>
            </div>
          </div>
        `;
      });
    }

    // Search and Filter Logic
    function filterData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const selectedCat = document.getElementById('categoryFilter').value;
      const selectedObj = document.getElementById('objectiveFilter').value;

      const filtered = platforms.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(search) || 
                              p.description.toLowerCase().includes(search) ||
                              p.objectives.some(o => o.toLowerCase().includes(search));
        const matchesCat = !selectedCat || p.category === selectedCat;
        const matchesObj = !selectedObj || p.objectives.includes(selectedObj);

        return matchesSearch && matchesCat && matchesObj;
      });

      renderCards(filtered);
    }

    // Modal Control
    function openModal(title, videoUrl) {
      document.getElementById('modalTitle').textContent = title + " - Overview";
      document.getElementById('modalIframe').src = videoUrl;
      document.getElementById('videoModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('videoModal').classList.add('hidden');
      document.getElementById('modalIframe').src = '';
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);
    document.getElementById('objectiveFilter').addEventListener('change', filterData);

    // Initial Setup
    populateFilters();
    renderCards(platforms);
  </script>
